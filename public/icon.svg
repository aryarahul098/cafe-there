<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#292524" stroke-width="4" />
  
  <!-- Subtle Amber Glow behind cup -->
  <circle cx="256" cy="280" r="140" fill="url(#glowGrad)" />

  <!-- Steam curves -->
  <path d="M210 140 Q200 170 210 200 Q220 230 210 240" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  <path d="M256 120 Q246 155 256 195 Q266 225 256 240" fill="none" stroke="#fcd34d" stroke-width="14" stroke-linecap="round" />
  <path d="M302 140 Q292 170 302 200 Q312 230 302 240" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.85" />

  <!-- Coffee Cup Body -->
  <path d="M150 260 L170 370 Q180 400 256 400 Q332 400 342 370 L362 260 Z" fill="url(#cupGrad)" />
  
  <!-- Coffee Cup Rim -->
  <ellipse cx="256" cy="260" rx="106" ry="24" fill="#fef3c7" />
  <ellipse cx="256" cy="260" rx="96" ry="18" fill="#78350f" />

  <!-- Cup Handle -->
  <path d="M346 280 C390 280 400 340 338 350" fill="none" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" />

  <!-- Saucer -->
  <path d="M130 410 Q256 440 382 410 Q392 420 372 430 Q256 460 140 430 Z" fill="#d97706" opacity="0.9" />

  <!-- Brand Label Text -->
  <text x="256" y="475" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">CAFE THERE</text>
</svg>
